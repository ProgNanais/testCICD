name: Preview per PR (Compose + Traefik)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]
    branches: [ main ]

jobs:
  build_and_deploy:
    if: github.event.action != 'closed'
    runs-on: self-hosted

    env:
      APP_ROUTER: myapp-pr-${{ github.event.number }}
      PREVIEW_HOST: pr-${{ github.event.number }}.myapp.127.0.0.1.sslip.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Calcule un chemin GHCR tout en minuscules + le tag de l'image
      - name: Compute image tag (lowercase GHCR path)
        id: meta
        run: |
          REPO_SLUG=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${REPO_SLUG}:pr-${{ github.event.number }}-${{ github.sha }}"
          echo "repo_slug=${REPO_SLUG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}"       >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}

      - name: Deploy preview (Compose up)
        run: |
          export IMAGE="${{ steps.meta.outputs.image }}"
          export APP_ROUTER="${APP_ROUTER}"
          export PREVIEW_HOST="${PREVIEW_HOST}"

          docker compose -p myapp_pr-${{ github.event.number }} \
            -f docker-compose.preview.yml pull || true

          docker compose -p myapp_pr-${{ github.event.number }} \
            -f docker-compose.preview.yml up -d

      - name: Comment URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const url = `http://${process.env.PREVIEW_HOST}`;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `🚀 Preview ready: ${url}`
            })

  destroy:
    if: github.event.action == 'closed'
    runs-on: self-hosted
    steps:
      - name: Teardown (Compose down)
        run: |
          docker compose -p myapp_pr-${{ github.event.number }} \
            -f docker-compose.preview.yml down -v || true
